name: OK Restaurant Platform CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Automated Tests
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://okrestaurant.com
